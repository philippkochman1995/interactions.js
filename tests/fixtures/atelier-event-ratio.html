<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/site-interactions-base.css">
  <link rel="stylesheet" href="/webflow-code/atelier-image-cards.css">
  <style>
    body { display: grid; gap: 2rem; padding: 2rem; }
    .news_event { width: 700px; padding: 1rem; background: #eee; }
    .intro_layout { display: grid; grid-template-columns: 400px 1fr; gap: 1rem; }
    .news_event img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .intro_content_about { min-height: 300px; }
    @media (max-width: 991px) {
      .intro_layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 767px) {
      .news_event { width: auto; }
      .news_event img { height: auto; }
    }
  </style>
</head>
<body data-atelier-image-page>
  <article class="news_event" data-testid="original-card">
    <div class="intro_layout">
      <img class="intro_img" data-testid="original-image" src="/tests/fixtures/image.svg" alt="Original">
      <div class="intro_content_about">Atelier Event</div>
    </div>
  </article>
  <article class="news_event" data-atelier-image-card data-testid="animated-card">
    <div class="intro_layout">
      <div class="img-zoom in" data-atelier-image-mask>
        <span class="zoom" data-atelier-image-zoom>
          <img class="intro_img" data-testid="animated-image" src="/tests/fixtures/image.svg" alt="Animiert">
        </span>
      </div>
      <div class="intro_content_about">Atelier Event</div>
    </div>
  </article>
</body>
</html>
