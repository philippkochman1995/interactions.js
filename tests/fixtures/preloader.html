<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/site-interactions-base.css">
  <style>
    body { margin: 0; }
    main { min-height: 200vh; }
    .test-image { width: 240px; height: 180px; }
    .top_bar_center .nav_logo_link { position: relative; display: block; width: 160px; height: 70px; }
  </style>
  <script src="/dist/site-head.js"></script>
</head>
<body>
  <header class="top_bar_center"><a class="nav_logo_link" href="/"><svg class="nav_logo" viewBox="0 0 160 70" aria-label="Franz West"><path d="M0 35h160" stroke="currentColor"/></svg></a></header>
  <main id="content"><a href="?next">Weiter</a><img class="test-image" src="/tests/fixtures/image.svg" alt="Werk"></main>
  <aside id="already-inert" inert>Unverändert gesperrt</aside>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    if (mode === 'cms') {
      document.querySelector('main').setAttribute('data-cms-works', '');
    }
    if (mode === 'spline' || mode === 'iframe' || mode === 'native' || mode === 'native3' || mode === 'native-early') {
      const native = mode.startsWith('native');
      const count = mode === 'native3' ? 3 : 1;
      for (let index = 0; index < count; index++) {
        const scene = document.createElement(mode === 'iframe' ? 'iframe' : native ? 'div' : 'spline-viewer');
        scene.id = index === 0 ? 'scene' : `scene-${index + 1}`;
        if (native) {
          scene.setAttribute('data-animation-type', 'spline');
          scene.setAttribute('data-spline-url', `https://prod.spline.design/test-${index + 1}/scene.splinecode`);
        } else {
          scene.setAttribute('data-preload-priority', 'critical');
          scene.setAttribute(mode === 'iframe' ? 'src' : 'url', 'https://prod.spline.design/test/scene.splinecode');
        }
        document.querySelector('main').append(scene);
        if (mode === 'native-early') scene.dispatchEvent(new Event('w-spline-load'));
      }
    }
  </script>
  <script src="/dist/site-body.js"></script>
  <script type="module" src="/dist/site-interactions.js"></script>
</body>
</html>
