<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/site-interactions-base.css">
  <link rel="stylesheet" href="/cms-canvas.css">
  <style>:root { --fw_off_white: #faf8f2; --fw_dark_purple: #06021a; }</style>
</head>
<body>
  <main data-cms-canvas></main>
  <div data-cms-canvas-source>
    <article data-cms-canvas-item data-canvas-id="one" data-canvas-size="Klein">
      <img data-canvas-thumbnail src="/tests/fixtures/image.svg" alt="First image">
      <div data-canvas-title>First context</div>
      <div data-canvas-modal-body><p>First modal body</p></div>
    </article>
    <article data-cms-canvas-item data-canvas-id="two" data-canvas-size="Mittel">
      <img data-canvas-thumbnail src="/tests/fixtures/image.svg" alt="Second image">
      <div data-canvas-title>Second context</div>
      <div data-canvas-modal-body><p>Second modal body</p></div>
    </article>
    <article data-cms-canvas-item data-canvas-id="three" data-canvas-size="Groß">
      <img data-canvas-thumbnail src="/tests/fixtures/image.svg" alt="Third image">
      <div data-canvas-title>Third context</div>
      <div data-canvas-modal-body><p>Third modal body</p></div>
    </article>
    <article data-cms-canvas-item data-canvas-id="four" data-canvas-size="Klein">
      <img data-canvas-thumbnail src="/tests/fixtures/image.svg" alt="Fourth image">
      <div data-canvas-title>Fourth context</div>
      <div data-canvas-modal-body><p>Fourth modal body</p></div>
    </article>
  </div>
  <script type="module" src="/dist/site-interactions.js"></script>
  <script type="module" src="/dist/cms-canvas.js"></script>
</body>
</html>
